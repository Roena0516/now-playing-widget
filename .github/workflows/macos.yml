name: macOS
on:
  push:
    paths: ['macos/**', 'assets/fonts/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['macos/**', 'assets/fonts/**', '.github/workflows/macos.yml']
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native app
        run: ./macos/build.sh --universal --dmg
      - name: Test LRC and player state
        run: '"macos/build/Now Playing Widget.app/Contents/MacOS/NowPlayingWidget" --self-test'
      - name: Test original lyric search and matching
        run: '"macos/build/Now Playing Widget.app/Contents/MacOS/NowPlayingWidget" --lyrics-tests'
      - name: Test YTMusic provider and credential isolation
        run: '"macos/build/Now Playing Widget.app/Contents/MacOS/NowPlayingWidget" --ytmusic-tests'
      - name: Test Pear authentication, WebSocket and controls
        run: python3 macos/Tests/mock_pear.py
      - name: Test updating from GitHub releases
        run: python3 macos/Tests/mock_update.py
      - name: Test the Discord listening status
        run: python3 macos/Tests/mock_discord.py
      - uses: actions/upload-artifact@v4
        with:
          name: NowPlayingWidget-macOS
          path: macos/build/NowPlayingWidget-macOS-*.dmg
